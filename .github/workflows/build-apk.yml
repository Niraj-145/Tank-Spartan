
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # 3. Set up Java
      - name: Set up Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 4. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 5. Install Node dependencies
      - name: Install Node Dependencies
        run: npm install --include=dev

      # 6. Verify Capacitor installation
      - name: Verify Capacitor Installation
        run: |
          npm ls @capacitor/cli @capacitor/core @capacitor/android
          ./node_modules/.bin/cap --version

      # 7. Build React/Vite application
      - name: Build Web Application
        run: npm run build

      # 8. Sync Capacitor Android
      - name: Sync Capacitor Android
        run: ./node_modules/.bin/cap sync android

      # 9. Build Android APK
      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # 10. Upload APK
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tank-Spartan-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
