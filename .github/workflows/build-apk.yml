
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # 3. Set up Java
      - name: Set up Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 4. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 5. Install dependencies
      - name: Install Node Dependencies
        run: npm ci

      # 6. Build React/Vite application
      - name: Build Web Application
        run: npm run build

      # 7. Initialize and sync Capacitor Android
      - name: Initialize & Sync Capacitor Android
        run: |
          echo "Checking Capacitor configuration..."
          npx cap doctor

          echo "Checking Android platform..."
          if [ ! -d android ]; then
            echo "Creating Android project..."
            npx cap add android
          else
            echo "Android project already exists."
          fi

          echo "Syncing Android project..."
          npx cap sync android

          echo "Capacitor Android setup completed."

      # 8. Build Android APK
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # 9. Upload APK
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tank-Spartan-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
